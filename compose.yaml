# `docker compose up` brings up the API and the web app together; the one-shot CLI scan sits
# behind the `cli` profile so it does not start with them.
services:
  scan:
    profiles: ["cli"]
    build:
      context: .
      target: cli
    image: techscope:local
    # The repository is mounted at /data so the domains file is readable and the
    # results land back in the working tree.
    volumes:
      - .:/data
    # On Linux a bind mount keeps host ownership, so the container needs the host identity
    # to write output.json: DOCKER_USER="$(id -u):$(id -g)" docker compose ...
    user: "${DOCKER_USER:-1000:1000}"
    # It needs no capabilities and writes only to the mount.
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command: ["scan", "docs/domains.txt", "-o", "output.json", "--log-level", "INFO"]

  api:
    build:
      context: .
      target: api
    image: techscope-api:local
    ports:
      - "8000:8000"
    # It serves from memory and writes nothing; the scan itself is the only outbound traffic.
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: ./web
      target: web
    image: techscope-web:local
    ports:
      - "3000:3000"
    environment:
      # The browser never learns this address: only the server action reads it.
      API_URL: http://api:8000
    depends_on:
      - api
    # It renders from memory and writes nothing.
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
